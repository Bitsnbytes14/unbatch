[project]
name = "unbatch"
version = "0.1.0"
description = "Settlement reconciliation agent — matches bank credit lines to expected settlement batches."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "jinja2>=3.1.6",
    "pandas>=3.0.5",
    "pydantic>=2",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.14.5",
    "typer>=0.27.2",
]

[project.scripts]
unbatch = "unbatch.cli:app"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
